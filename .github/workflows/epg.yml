name: Data Engine

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core_process:
    concurrency:
      group: sync-env
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    
    env:
      PER_SITE_JOBS: "10"
      
    steps:
      - name: Fetch Repository Sources
        uses: actions/checkout@v4

      - name: Fetch Submodule Dependencies
        run: git clone --depth 1 https://github.com/iptv-org/epg.git

      - name: Set Runtime Environment
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: epg/package-lock.json

      - name: Execute Main Task
        id: task_execution
        shell: bash
        env:
          NODE_OPTIONS: "--max-old-space-size=6000"
          PIPELINE: |
            #!/usr/bin/env bash
            set -euo pipefail
            OUTDIR="${OUTDIR:-$RUNNER_TEMP}"; export OUTDIR
            
            echo "::group::Runtime Preparation"
            pushd epg >/dev/null
            npm ci --no-audit --no-fund --silent
            popd >/dev/null
            echo "::endgroup::"
            
            echo "::group::Structure Validation"
            test -s "${GITHUB_WORKSPACE}/channels.xml"
            
            python << 'PY'
            import os, json, xml.etree.ElementTree as ET
            gw=os.environ["GITHUB_WORKSPACE"]; outdir=os.environ["OUTDIR"]
            
            r=ET.parse(os.path.join(gw,"channels.xml")).getroot(); mp={}
            for ch in r.findall("channel"):
                site=(ch.get("site") or "").strip().lower()
                if site: mp.setdefault(site, []).append(ch)
                
            os.makedirs(outdir, exist_ok=True)
            for site, ch_list in mp.items():
                root=ET.Element("channels")
                for ch in ch_list: root.append(ch)
                try: ET.indent(root,space="  ",level=0)
                except: pass
                ET.ElementTree(root).write(
                    os.path.join(outdir,f"_all_{site}.channels.xml"),
                    encoding="utf-8",xml_declaration=True
                )
            PY
            echo "::endgroup::"
            
            cat <<'BASH' > "${RUNNER_TEMP}/helpers.sh"
            set -euo pipefail
            tune_params() { local s="$1" maxc=18 tout=25000; echo "$maxc $tout"; }
            filter_log() { awk '/^\s*info\s+\[[0-9]+\/[0-9]+\].*\([0-9]+ programs\)/||/saving to/||/^\s*success\s+done/'; }
            throttle(){ local lim="${PER_SITE_JOBS:-10}"; while [ "$(jobs -rp | wc -l)" -ge "$lim" ]; do wait -n || true; done; }
            
            retry_grab() {
                local ch="$1" site="$2" out="$3" maxc="$4" tout="$5"
                echo "Processing $site"
                SECONDS=0
                try(){ npm run grab -- --channels="$ch" --days=2 --maxConnections="$maxc" --timeout="$tout" --output="$out" | filter_log; }
                if (try) || (sleep 2 && try) || (sleep 4 && try); then
                    return 0
                else
                    return 1
                fi
            }
            
            run_block() {
                shopt -s nullglob
                local prefix="$1" outdir="$2"
                for f in "${OUTDIR}/${prefix}_"*.channels.xml; do
                    [ -s "$f" ] || continue
                    grep -q '<channel' "$f" || continue
                    local site="$(basename "$f")"; site="${site#${prefix}_}"; site="${site%.channels.xml}"
                    read MAXC TOUT < <(tune_params "$site")
                    local out="${outdir}/${prefix}_${site}.xml"
                    throttle; (
                        if retry_grab "$f" "$site" "$out" "$MAXC" "$TOUT"; then
                            echo "Success: $site"
                        else
                            echo "Failed: $site"; : > "$out"
                        fi
                    ) &
                done
                wait || true
            }
            BASH
            
            echo "::group::Data Matrix Compilation"
            pushd epg >/dev/null
            source "${RUNNER_TEMP}/helpers.sh"
            mkdir -p "${OUTDIR}/out-all"
            run_block "_all" "${OUTDIR}/out-all"
            popd >/dev/null
            echo "::endgroup::"
            
            echo "::group::Data Merge System"
            python << 'PY'
            import os, glob, xml.etree.ElementTree as ET
            gw=os.environ["GITHUB_WORKSPACE"]; temp=os.environ["OUTDIR"]
            files=sorted([f for f in glob.glob(os.path.join(temp, "out-all","_all_*.xml")) if os.path.isfile(f) and os.path.getsize(f)>0])
            
            if not files:
                with open(os.path.join(gw,"guide.xml"), "w", encoding="utf-8") as f:
                    f.write('<?xml version="1.0" encoding="UTF-8"?>\n<tv></tv>')
            else:
                t0=ET.parse(files[0]); r0=t0.getroot()
                chs=set(c.get("id", "") for c in r0.findall("channel"))
                progs=set((p.get("channel", ""), p.get("start", "")) for p in r0.findall("programme"))
                for pth in files[1:]:
                    try: r=ET.parse(pth).getroot()
                    except: continue
                    for c in r.findall("channel"):
                        cid=c.get("id","")
                        if cid and cid not in chs:
                            r0.append(c); chs.add(cid)
                    for pr in r.findall("programme"):
                        k=(pr.get("channel", ""), pr.get("start",""))
                        if k not in progs:
                            r0.append(pr); progs.add(k)
                try: ET.indent(t0,space="  ", level=0)
                except: pass
                out_guide=os.path.join(gw,"guide.xml")
                t0.write(out_guide,encoding="utf-8",xml_declaration=True)
                print("Process finished.")
            PY
            echo "::endgroup::"
        run: |
          set -euo pipefail
          printf '%s\n' "$PIPELINE" > "$RUNNER_TEMP/pipeline.sh"
          chmod +x "$RUNNER_TEMP/pipeline.sh"
          bash "$RUNNER_TEMP/pipeline.sh" 2>&1 | tee "$GITHUB_WORKSPACE/output.log"

      - name: Export Execution Records
        uses: actions/upload-artifact@v4
        with:
          name: runtime-records
          path: output.log
          if-no-files-found: warn
          retention-days: 7

      - name: Export Output Payload
        uses: actions/upload-artifact@v4
        with:
          name: compiled-payload
          path: guide.xml
          retention-days: 7

      - name: Sync Cloud Database
        env:
          GIST_PAT: ${{ secrets.GIST_PAT }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          set -euo pipefail
          
          # Generazione robusta del payload JSON iniettando il file xml come stringa pura pulita
          jq -n --rawfile xml_content guide.xml '{files: {"guide.xml": {content: $xml_content}}}' > json_payload.json
          
          curl -L \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GIST_PAT" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            https://github.com \
            -d @json_payload.json
            
          rm -f json_payload.json
          echo "Process sync end."
